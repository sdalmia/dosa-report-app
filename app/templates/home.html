<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12110e">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <title>Command Centre</title>
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("dosa-theme"); } catch (err) {}
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Dosa Coffee">
      <h1 class="h3 mt-3">Command Centre</h1>
      <p>Sales, stores, flags, and the tools for the day.</p>
      <a href="{{ url_for('google.login') }}" class="btn btn-primary mt-2">Login with Google</a>
      <button type="button" class="cc-icon-btn mt-3" id="theme-toggle">Theme</button>
    </div>
    <footer class="cc-footer">© Dalgreen Foods Private Limited. All rights reserved.</footer>
  </div>
  <script src="{{ url_for('static', filename='js/command.js') }}"></script>
</body>
</html>
