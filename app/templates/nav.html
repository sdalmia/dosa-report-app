<header class="cc-header">
  <a class="cc-brand" href="{{ url_for('main.dashboard') }}">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Dosa Coffee">
    <span>Command</span>
  </a>
  <span class="cc-header-spacer"></span>
  {% if session.get('user') %}
    <span class="cc-hello">Hi, {{ session['user']['name'].split(' ')[0] }}</span>
  {% endif %}
  <button type="button" class="cc-icon-btn" id="theme-toggle" aria-label="Switch theme"><i class="bi bi-moon" aria-hidden="true"></i></button>
  <button type="button" class="cc-icon-btn" id="nav-menu" aria-expanded="false" aria-controls="nav-drawer" aria-label="Menu"><i class="bi bi-list" aria-hidden="true"></i></button>
</header>
<nav class="cc-drawer" id="nav-drawer" aria-label="Account">
  <h2>Account</h2>
  <a href="{{ url_for('ingredient_tracker.upload') }}">Upload prices</a>
  {% if session.get('user') %}
    <a href="{{ url_for('auth.logout') }}">Logout</a>
  {% else %}
    <a href="{{ url_for('google.login') }}">Login</a>
  {% endif %}
</nav>
