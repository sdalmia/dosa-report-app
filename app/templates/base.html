<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <title>{% block title %}Dosa Coffee{% endblock %}</title>
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("dosa-theme"); } catch (err) {}
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
</head>
<body>
  {% block nav %}{% include "nav.html" %}{% endblock %}
  <main class="cc-main">
    {% block content %}{% endblock %}
    <footer class="cc-footer">
      © Dalgreen Foods Private Limited. All rights reserved.
      This software is provided “as is” without warranty of any kind.
    </footer>
  </main>
  <script src="{{ url_for('static', filename='js/command.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
