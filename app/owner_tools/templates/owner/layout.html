{% extends "base.html" %}

<link rel="stylesheet" href="{{ url_for('owner.static', filename='owner.css') }}">
<div class="owner-tools">
  <nav class="ot-nav" aria-label="Owner tools">
    <a href="{{ url_for('owner.brief') }}" class="{% if active == 'brief' %}is-on{% endif %}">Brief</a>
    <a href="{{ url_for('owner.scorecard') }}" class="{% if active == 'scorecard' %}is-on{% endif %}">Scorecard</a>
    <a href="{{ url_for('owner.labour') }}" class="{% if active == 'labour' %}is-on{% endif %}">Labour</a>

  {% block owner_body %}{% endblock %}
</div>
{% endblock %}
